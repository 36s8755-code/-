name: Update NEIS dinner menus

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-meals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch current and next month dinner menus from NEIS
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from calendar import monthrange

          api_key = os.environ.get("NEIS_API_KEY", "").strip()
          if not api_key:
              print("Repository secret NEIS_API_KEY is missing.", file=sys.stderr)
              sys.exit(1)

          now = datetime.now(ZoneInfo("Asia/Seoul"))
          first_day = now.replace(day=1)
          if now.month == 12:
              next_month = first_day.replace(year=now.year + 1, month=1)
          else:
              next_month = first_day.replace(month=now.month + 1)
          last_month = next_month.replace(day=monthrange(next_month.year, next_month.month)[1])
          from_ymd = first_day.strftime("%Y%m%d")
          to_ymd = last_month.strftime("%Y%m%d")

          params = {
              "KEY": api_key,
              "Type": "json",
              "pIndex": "1",
              "pSize": "100",
              "ATPT_OFCDC_SC_CODE": "B10",
              "SD_SCHUL_CODE": "7010259",
              "MMEAL_SC_CODE": "3",
              "MLSV_FROM_YMD": from_ymd,
              "MLSV_TO_YMD": to_ymd,
          }
          url = "https://open.neis.go.kr/hub/mealServiceDietInfo?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(url, headers={"User-Agent": "HYFL-Dinner-Menu/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.loads(response.read().decode("utf-8"))

          rows = []
          blocks = payload.get("mealServiceDietInfo", [])
          if len(blocks) > 1:
              rows = blocks[1].get("row", []) or []

          output = {
              "updatedAt": now.isoformat(),
              "from": from_ymd,
              "to": to_ymd,
              "rows": rows,
          }
          with open("meals.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)
          print(f"Saved {len(rows)} dinner menu rows for {from_ymd}–{to_ymd}.")
          PY

      - name: Commit updated menu data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meals.json
          if git diff --cached --quiet; then
            echo "No menu changes to commit."
          else
            git commit -m "Update NEIS dinner menus"
            git push
          fi
